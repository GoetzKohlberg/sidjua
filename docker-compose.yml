# SIDJUA — AI Governance Platform
# https://sidjua.com | AGPL-3.0-only
#
# Quick Start:
#   docker compose up -d
#   docker compose exec sidjua_blue sidjua api-key generate
#   export SIDJUA_API_KEY=<key-from-above>
#   docker compose exec sidjua_blue sidjua apply
#
# Blue/Green Update Architecture (V1.0.2+):
#   - Caddy (proxy) is the single external entry point on port 3000
#   - sidjua_blue is the active instance (port 4200 internal)
#   - sidjua-updater sidecar orchestrates zero-downtime updates
#   - sidjua_green is created dynamically by the sidecar (not in this file)
#
# Semantic Search (V0.9.5+, optional):
#   docker compose --profile semantic-search up -d
#
# Documentation: https://sidjua.com/docs

services:

  # ---------------------------------------------------------------------------
  # Caddy — Reverse proxy and single external entry point
  # Manages blue/green slot routing via Admin API (port 2019, internal only)
  # ---------------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    container_name: sidjua-proxy
    ports:
      - "127.0.0.1:47821:3000"
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sidjua-gui/dist:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - sidjua-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # sidjua_blue — Active application instance
  # Port 4200 (SIDJUA_PORT) is internal only; Caddy proxies external traffic
  # ---------------------------------------------------------------------------
  sidjua_blue:
    image: ghcr.io/goetzkohlberg/sidjua:1.0.1
    container_name: sidjua_blue
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SIDJUA_PORT=4200
      - SIDJUA_DATA_DIR=/app/data
      - SIDJUA_CONFIG_DIR=/app/config
      - SIDJUA_LOG_DIR=/app/logs
      - INSTANCE_SLOT=blue
      - UPDATER_URL=http://sidjua-updater:8090
      # Optional — set to enable semantic search (V0.9.5+)
      - SIDJUA_QDRANT_URL=${SIDJUA_QDRANT_URL:-}
      - SIDJUA_API_KEY=${SIDJUA_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - sidjua-data:/app/data
      - sidjua-config:/app/config
      - sidjua-logs:/app/logs
      - sidjua-system:/app/.system
      - sidjua-workspace:/app/agents
      - sidjua-governance:/app/governance
    security_opt:
      - "seccomp=seccomp-profile.json"
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.SIDJUA_PORT||'4200')+'/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sidjua-net

  # ---------------------------------------------------------------------------
  # sidjua-updater — Blue/Green update sidecar
  # Orchestrates pull, freeze, migrate, healthcheck, proxy switch, drain
  # sidjua_green is created dynamically by the sidecar (NOT defined here)
  # ---------------------------------------------------------------------------
  sidjua-updater:
    image: ghcr.io/goetzkohlberg/updater:1.0
    container_name: sidjua-updater
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sidjua-config:/app/config:ro
    environment:
      - SIDJUA_COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME:-sidjua}
      - REGISTRY=ghcr.io/goetzkohlberg
      - CADDY_ADMIN=http://proxy:2019
    networks:
      - sidjua-net
    restart: "no"

  # ---------------------------------------------------------------------------
  # Qdrant — Vector database for semantic search (V0.9.5+, OPTIONAL)
  #
  # NOT started by default. To enable:
  #   docker compose --profile semantic-search up -d
  # ---------------------------------------------------------------------------
  qdrant:
    profiles: ["semantic-search"]
    image: qdrant/qdrant:v1.13.2
    container_name: sidjua-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sidjua-net

  # ---------------------------------------------------------------------------
  # Grafana — Activity dashboards (optional, monitoring profile)
  #
  # NOT started by default. To enable:
  #   docker compose --profile monitoring up -d
  #
  # Opens dashboards at http://localhost:3001 (default credentials: admin/sidjua)
  # ---------------------------------------------------------------------------
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana-oss:11.5.2
    container_name: sidjua-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - sidjua-system:/sidjua-system:ro
    environment:
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-sidjua}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_PORT:-3001}
    networks:
      - sidjua-net
    depends_on:
      sidjua_blue:
        condition: service_healthy

volumes:
  sidjua-data:
    name: sidjua-data
  sidjua-config:
    name: sidjua-config
  sidjua-logs:
    name: sidjua-logs
  sidjua-system:
    name: sidjua-system
  sidjua-workspace:
    name: sidjua-workspace
  sidjua-governance:
    name: sidjua-governance
  qdrant-data:
    name: sidjua-qdrant-data
  grafana-data:
    name: sidjua-grafana-data
  caddy-data:
    name: sidjua-caddy-data
  caddy-config:
    name: sidjua-caddy-config

networks:
  sidjua-net:
    name: sidjua-net
    driver: bridge
