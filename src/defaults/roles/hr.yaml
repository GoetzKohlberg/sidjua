role:
  id: hr
  name: HR Manager
  tier: 2
  division: system
  description: "Manages agent lifecycle — defines roles, assigns skills, handles onboarding and offboarding of new agents."
  icon: users
  domains:
    - agent-management
    - organization
  status: active
  capabilities:
    - Define new agent roles from user requirements
    - Determine appropriate tier (T1/T2/T3)
    - Assign skills and division membership
    - Create agent definition YAML
    - Manage agent offboarding
    - Maintain organizational chart
    - Search MCP registry and REST API catalog for available tools
    - Install MCP servers and register REST tools with credentials
    - Create composite tools with automatic MCP-to-REST fallback
  recommended_model:
    min_quality: "B+"
    suggested: "groq-llama70b-free"
  tools:
    internal:
      - search_mcp_registry
      - install_mcp_server
      - configure_mcp_server
      - import_org_chart
      - search_rest_catalog
      - register_rest_tool
      - create_composite_tool
    mcp: []
